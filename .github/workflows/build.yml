name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: slimecrack-linux-x64
            exe: slimecrack
            flags: ""
          - os: windows-latest
            name: slimecrack-windows-x64
            exe: slimecrack.exe
            # MinGW gcc, linked statically so the .exe needs no libgomp / winpthread DLLs next to it
            flags: -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_EXE_LINKER_FLAGS=-static
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSLIMECRACK_NATIVE=OFF ${{ matrix.flags }}

      - name: Build
        run: cmake --build build

      - name: Smoke test
        shell: bash
        run: |
          # no arguments prints the usage and exits 1, which is expected
          out=$(./build/${{ matrix.exe }} 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "^usage"
          # a real run: exit code 0 (match) or 2 (mismatch) are both fine, a crash is not
          printf 'x,z\n0,0\n' > t.csv
          rc=0; ./build/${{ matrix.exe }} check 0 t.csv || rc=$?
          [ "$rc" -le 2 ]

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp build/${{ matrix.exe }} dist/
          cd dist && sha256sum ${{ matrix.exe }} > ${{ matrix.exe }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
